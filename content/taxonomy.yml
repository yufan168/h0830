# 站台設定與分類表。
# AI 可以新增分類，但必須同步在 content/faq/ 建立至少一張該分類的知識卡，
# 否則驗證器會擋下空分類。
site:
  name: 雲析工作臺
  short_name: 雲析
  kb_name: 客服知識中心
  tagline: 找答案不用等客服，常見問題都在這裡。
  base_url: https://support.cloudlens.example
  locale: zh-Hant-TW
  version: 2026.08
  contact:
    hours: 週一至週五 09:00 至 18:00（國定假日休息）
    email: support@cloudlens.example
    report_url: https://support.cloudlens.example/report
    note: 送出問題後，我們會在一個工作日內以電子郵件回覆。

categories:
  - id: account
    name: 帳號與登入
    summary: 註冊、登入、雙重驗證與帳號安全相關問題。
    icon: 🔐
    weight: 10
  - id: billing
    name: 訂閱與帳單
    summary: 方案選擇、發票、付款方式與退款規則。
    icon: 🧾
    weight: 20
  - id: data
    name: 資料匯入與匯出
    summary: 匯入既有資料、批次匯出與備份保存期限。
    icon: 📦
    weight: 30
  - id: team
    name: 團隊與權限
    summary: 邀請成員、角色權限設定與跨團隊協作。
    icon: 👥
    weight: 40
  - id: troubleshooting
    name: 疑難排解
    summary: 連線異常、載入緩慢與常見錯誤訊息的處理方式。
    icon: 🛠️
    weight: 50
