<ul class="card-list">
{{#cards}}
  <li class="kb-card">
    <h3 class="kb-card-title"><a href="{{href}}">{{title}}</a></h3>
    <p class="kb-card-summary">{{summary}}</p>
    <p class="kb-card-meta">
      <span class="tag">{{category_name}}</span>
      <span class="badge {{status_css}}">{{status_label}}</span>
      <span class="kb-card-date">更新於 {{updated}}</span>
    </p>
  </li>
{{/cards}}
</ul>
