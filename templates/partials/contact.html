<section class="contact-cta" aria-labelledby="contact-heading">
  <h2 id="contact-heading">還是沒解決嗎？</h2>
  <p class="contact-note">{{site.contact.note}}</p>
  <dl class="contact-list">
    <div class="contact-item">
      <dt>服務時間</dt>
      <dd>{{site.contact.hours}}</dd>
    </div>
    <div class="contact-item">
      <dt>客服信箱</dt>
      <dd><a href="mailto:{{site.contact.email}}">{{site.contact.email}}</a></dd>
    </div>
    <div class="contact-item">
      <dt>問題回報</dt>
      <dd><a href="{{site.contact.report_url}}">送出問題表單</a></dd>
    </div>
  </dl>
</section>
