<div class="search" data-search-root data-index="{{rel}}search-index.json">
  <label class="search-label" for="kb-search">搜尋常見問題</label>
  <input id="kb-search" type="search" class="search-input" placeholder="輸入關鍵字，例如：發票、密碼、匯入" autocomplete="off" />
  <p class="search-hint" data-search-hint>共有 {{total_cards}} 則知識卡，輸入兩個字以上開始搜尋。</p>
  <ul class="search-results" data-search-results hidden></ul>
</div>
