<section class="hero">
  <h1 class="hero-title">{{site.kb_name}}</h1>
  <p class="hero-tagline">{{site.tagline}}</p>
</section>

{{> search}}

<section class="section" aria-labelledby="nav-heading">
  <h2 id="nav-heading" class="section-title">依主題瀏覽</h2>
  <ul class="topic-grid">
  {{#topics}}
    <li class="topic-card">
      <a class="topic-link" href="{{href}}">
        <span class="topic-icon" aria-hidden="true">{{icon}}</span>
        <span class="topic-name">{{title}}</span>
      </a>
      <p class="topic-summary">{{description}}</p>
      <p class="topic-count">{{count}} 個{{unit}}</p>
    </li>
  {{/topics}}
  </ul>
</section>

<section class="section" aria-labelledby="hot-heading">
  <h2 id="hot-heading" class="section-title">熱門問題</h2>
  <ul class="hot-list">
  {{#popular}}
    <li><a href="{{href}}">{{title}}</a></li>
  {{/popular}}
  </ul>
  <p class="more-link"><a href="faq.html">看全部常見問題</a></p>
</section>

{{> contact}}
