<nav class="breadcrumb" aria-label="麵包屑">
  <ol>
    <li><a href="{{rel}}index.html">{{site.kb_name}}</a></li>
    <li aria-current="page">{{category.name}}</li>
  </ol>
</nav>

<section class="hero hero-compact">
  <h1 class="hero-title"><span class="category-icon" aria-hidden="true">{{category.icon}}</span>{{category.name}}</h1>
  <p class="hero-tagline">{{category.summary}}</p>
  <p class="hero-count">共 {{category.count}} 則問題</p>
</section>

<section class="section" aria-labelledby="list-heading">
  <h2 id="list-heading" class="section-title">這個主題的問題</h2>
  {{> card-list}}
  {{^cards}}
  <p class="empty-state">這個主題目前還沒有已發布的知識卡。</p>
  {{/cards}}
</section>

{{> contact}}
